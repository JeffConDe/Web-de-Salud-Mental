services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php -S 0.0.0.0:8000 -t public public/index.php
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_NAME: "Salud Mental API"
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      CACHE_STORE: file
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: saludmental
      DB_USERNAME: saludmental
      DB_PASSWORD: local-saludmental
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saludmental
      POSTGRES_USER: saludmental
      POSTGRES_PASSWORD: local-saludmental
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saludmental -d saludmental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  postgres_data:
