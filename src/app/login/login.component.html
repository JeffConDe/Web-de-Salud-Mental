<section class="auth-page">
  <div class="auth-card">
    <a class="back-link" routerLink="/">← Volver al inicio</a>
    <p class="eyebrow">Qué bueno verte</p>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Continúa tu recorrido de bienestar.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="tu@correo.com" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Tu contraseña" autocomplete="current-password" required>

      <button class="button submit-button" type="submit" [disabled]="loginForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    @if (message) {
      <p class="form-message" role="status">{{ message }}</p>
    }

    <p class="switch-auth">¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    <p class="demo-note">Usa datos de prueba mientras ejecutas el backend local de desarrollo.</p>
  </div>
</section>
