<section class="auth-page">
  <div class="auth-card">
    <a class="back-link" routerLink="/">← Volver al inicio</a>
    <p class="eyebrow">Tu espacio empieza aquí</p>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Un paso pequeño para comenzar a cuidarte.</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <label for="name">Nombre</label>
      <input id="name" type="text" name="name" [(ngModel)]="name" placeholder="¿Cómo te llamas?" autocomplete="name" required>

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="tu@correo.com" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Al menos 8 caracteres" autocomplete="new-password" minlength="8" required>

      <label for="confirm-password">Confirma tu contraseña</label>
      <input id="confirm-password" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Escríbela de nuevo" autocomplete="new-password" minlength="8" required>

      <button class="button submit-button" type="submit" [disabled]="registerForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    @if (message) {
      <p class="form-message" role="status">{{ message }}</p>
    }

    <p class="switch-auth">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    <p class="demo-note">Usa datos de prueba. La contraseña se almacena como hash, no en texto plano.</p>
  </div>
</section>
